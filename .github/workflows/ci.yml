name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.platform }} ${{ matrix.arch }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS
            arch: arm64
          - os: macos-15-intel
            platform: macOS
            arch: x64
          - os: windows-2025
            platform: Windows
            arch: x64
          - os: ubuntu-24.04
            platform: Linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3 build-essential xvfb
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run tests
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Install headless browser
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium --only-shell
      - name: Check interface without launching Electron
        if: runner.os == 'Linux'
        run: npm run test:ui
      - name: Check project editor workflows without launching Electron
        if: runner.os == 'Linux'
        run: npm run test:projects
      - name: Install isolated localhost automation test runtime
        if: runner.os != 'Windows'
        run: python -m pip install ansible-core==2.21.5 ansible-runner==2.4.3
      - name: Check Ansible using only a temporary localhost fixture
        if: runner.os != 'Windows'
        run: npm run test:ansible
      - name: Verify native IPC and editor workers on the application protocol
        if: runner.os == 'Linux'
        env:
          TERMFORGE_CI_NO_SANDBOX: '1'
          TERMFORGE_SMOKE_DIR: ${{ runner.temp }}/termforge-smoke
        run: xvfb-run -a npm run smoke
      - name: Retain native smoke evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: termforge-linux-native-smoke
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/termforge-smoke/*.json
            ${{ runner.temp }}/termforge-smoke/*.png
