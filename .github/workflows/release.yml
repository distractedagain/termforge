name: Build release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }} (public preview)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS
            arch: arm64
          - os: macos-15-intel
            platform: macOS
            arch: x64
          - os: windows-2025
            platform: Windows
            arch: x64
          - os: ubuntu-24.04
            platform: Linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3 build-essential
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run tests
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Package for this operating system
        run: npx --no-install electron-builder --${{ matrix.arch }} --publish never
      - name: Verify macOS ad-hoc signature integrity (unnotarized)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync, spawnSync } = require('node:child_process');
          const appName = require('./package.json').productName + '.app';
          const bundles = fs.readdirSync('release', { withFileTypes: true })
            .filter(entry => entry.isDirectory())
            .map(entry => path.join('release', entry.name, appName))
            .filter(bundle => fs.existsSync(bundle) && fs.statSync(bundle).isDirectory());
          if (bundles.length !== 1) throw new Error('Expected one packaged macOS application');
          const bundle = bundles[0];
          execFileSync('codesign', ['--verify', '--deep', '--strict', '--verbose=2', bundle], { stdio: 'inherit' });
          const signature = spawnSync('codesign', ['--display', '--verbose=4', bundle], { encoding: 'utf8' });
          if (signature.error) throw signature.error;
          if (signature.status !== 0) throw new Error(signature.stderr || 'Cannot inspect macOS signature');
          if (!/(^|\n)Signature=adhoc(\r?\n|$)/.test(signature.stderr)) throw new Error('Expected an ad-hoc signature');
          process.stdout.write(signature.stderr);
          NODE
      - name: Record checksums and build provenance
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const files = fs.readdirSync('release').filter(file => /\.(zip|dmg|exe|AppImage|deb|blockmap)$/.test(file)).sort();
          if (!files.length) throw new Error('No installer or archive was produced');
          const checksums = files.map(file => {
            const hash = crypto.createHash('sha256').update(fs.readFileSync(path.join('release', file))).digest('hex');
            return `${hash}  ${file}`;
          });
          fs.writeFileSync('release/SHA256SUMS.txt', checksums.join('\n') + '\n');
          const signing = process.platform === 'darwin'
            ? { type: 'ad-hoc', developerIdSigned: false, notarized: false, signatureIntegrityVerified: true }
            : process.platform === 'win32'
              ? { type: 'unsigned', authenticodeSigned: false }
              : { type: 'none' };
          fs.writeFileSync('release/BUILD_INFO.json', JSON.stringify({
            name: require('./package.json').productName,
            version: require('./package.json').version,
            commit: process.env.GITHUB_SHA,
            platform: process.platform,
            architecture: process.arch,
            signing,
            backendUnitTestsPassed: true,
            rendererBuildPassed: true,
            desktopRuntimeTested: false,
            files
          }, null, 2) + '\n');
          NODE
      - name: Retain public preview build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: termforge-${{ matrix.platform }}-${{ matrix.arch }}-public-preview
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            release/*.zip
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/SHA256SUMS.txt
            release/BUILD_INFO.json
