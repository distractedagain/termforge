name: Diagnose Windows key prompts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-key-prompts:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inspect only synthetic private console prompts
        run: node scripts/key-tools-windows-diagnostic.cjs
